# Hide the Intel IPU6's raw capture channels from PipeWire.
# The IPU6 exposes 48 V4L2 capture nodes (driver "isys"). They only carry raw
# sensor data, so apps listing them as cameras get no usable image. The real
# camera comes through libcamera ("Built-in Front Camera"). USB webcams use
# the uvcvideo driver and are not affected.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.api = "v4l2"
        api.v4l2.cap.driver = "isys"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

