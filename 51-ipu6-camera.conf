# Hide the Intel IPU6's raw capture channels from PipeWire.
# The IPU6 exposes 48 V4L2 capture nodes (driver "isys"). They only carry raw
# sensor data, so apps listing them as cameras get no usable image. The real
# camera comes through libcamera ("Built-in Front Camera"). The match uses the
# IPU6's PCI address (udev ID_PATH): the rule runs before the device is opened,
# so the api.v4l2.cap.* properties don't exist yet. USB webcams are on another
# bus path and are not affected.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.api = "v4l2"
        device.bus-path = "pci-0000:00:05.0"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# Suspend the camera as soon as it goes idle, without pausing it first.
# PipeWire's libcamera camera, restarted from paused (any reopen within the
# default 5 s idle time), keeps sending only a few frames per second.
monitor.libcamera.rules = [
  {
    matches = [
      {
        node.name = "~libcamera_input.*"
      }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0.2
      }
    }
  }
]

