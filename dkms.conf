PACKAGE_NAME="ov02c10-26mhz"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="ov02c10"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KDIR=${kernel_source_dir}"
# The patched source is from kernel 7.2.11; older kernels have a different
# V4L2 sensor API, so only build for 7.2 and newer.
BUILD_EXCLUSIVE_KERNEL="^(7\.([2-9]|[1-9][0-9])|([8-9]|[1-9][0-9]+))\."
AUTOINSTALL="yes"
